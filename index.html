<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Movie Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 text-gray-900 transition-colors">

  <header class="p-4 bg-white dark:bg-gray-900 dark:text-white shadow flex justify-between items-center">
    <h1 class="text-2xl font-bold">My Movie Tracker</h1>
    <div class="flex gap-2 items-center">
      <input type="text" id="searchInput" placeholder="Search movies..." class="border p-2 rounded w-64 dark:bg-gray-700 dark:text-white">
      <button id="toggleMode" class="p-2 border rounded">🌓</button>
    </div>
  </header>

  <main class="p-4 space-y-6">
    <section id="searchResults" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></section>

    <div class="flex space-x-2 justify-center">
      <button class="tab-btn" data-tab="watchlist">🎯 Watchlist</button>
      <button class="tab-btn" data-tab="watching">👁 Watching</button>
      <button class="tab-btn" data-tab="finished">✅ Finished</button>
    </div>

    <section id="movieSections">
      <div id="watchlist" class="movie-section hidden">
        <h2 class="text-xl font-semibold my-2">🎯 Watchlist</h2>
        <div class="sort-controls"></div>
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
      </div>
      <div id="watching" class="movie-section hidden">
        <h2 class="text-xl font-semibold my-2">👁 Watching</h2>
        <div class="sort-controls"></div>
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
      </div>
      <div id="finished" class="movie-section hidden">
        <h2 class="text-xl font-semibold my-2">✅ Finished</h2>
        <div class="sort-controls"></div>
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
      </div>
    </section>
  </main>

  <button id="fab" class="fixed bottom-6 right-6 p-4 bg-blue-600 text-white rounded-full shadow-xl hover:bg-blue-700">➕</button>

  <div id="modal" class="fixed inset-0 hidden bg-black bg-opacity-60 flex justify-center items-center z-50">
    <div class="bg-white dark:bg-gray-800 p-4 rounded max-w-md w-full relative">
      <button onclick="closeModal()" class="absolute right-2 top-2 text-xl">✖</button>
      <div id="modalContent" class="text-sm text-gray-800 dark:text-white"></div>
    </div>
  </div>

  <footer class="text-center p-4 text-xs text-gray-600 dark:text-gray-300">
    This product uses the TMDb API but is not endorsed or certified by TMDb.
  </footer>

  <script src="script.js"></script>
</body>
</html>
