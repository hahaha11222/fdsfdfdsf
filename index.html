<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Movie Diary</title>

  <!-- TailwindCSS -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

  <!-- Handwritten + Serif Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script&family=DM+Serif+Text&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-paper-light dark:bg-paper-dark text-gray-800 dark:text-gray-100 font-serif transition-colors duration-300">

  <header class="p-6 flex justify-between items-center bg-opacity-70 backdrop-blur border-b border-gray-300 dark:border-gray-700">
    <h1 class="text-3xl font-handwriting">My Movie Diary</h1>
    <div class="flex gap-2 items-center">
      <input type="text" id="searchInput" placeholder="Search movies..." class="p-2 rounded border bg-white bg-opacity-80 dark:bg-gray-800 dark:border-gray-600 dark:text-white w-64">
      <button id="toggleMode" class="p-2 border rounded text-xl dark:border-gray-500">🌗</button>
    </div>
  </header>

  <main class="p-6 space-y-8">
    <section id="searchResults" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6"></section>

    <div class="flex space-x-4 justify-center text-lg">
      <button class="tab-btn" data-tab="watchlist">🎯 Watchlist</button>
      <button class="tab-btn" data-tab="watching">👁 Watching</button>
      <button class="tab-btn" data-tab="finished">✅ Finished</button>
    </div>

    <section id="movieSections">
      <div id="watchlist" class="movie-section hidden">
        <h2 class="section-title">🎯 Watchlist</h2>
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6"></div>
      </div>

      <div id="watching" class="movie-section hidden">
        <h2 class="section-title">👁 Watching</h2>
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6"></div>
      </div>

      <div id="finished" class="movie-section hidden">
        <h2 class="section-title">✅ Finished</h2>
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6"></div>
      </div>
    </section>
  </main>

  <button id="fab" class="fixed bottom-6 right-6 p-4 bg-pink-500 text-white rounded-full shadow-xl hover:bg-pink-600 text-2xl transition">➕</button>

  <div id="modal" class="fixed inset-0 hidden bg-black bg-opacity-60 flex justify-center items-center z-50">
    <div class="bg-white dark:bg-gray-900 p-6 rounded-lg max-w-md w-full relative shadow-2xl">
      <button onclick="closeModal()" class="absolute right-4 top-3 text-xl">✖</button>
      <div id="modalContent" class="text-sm mt-4 space-y-3"></div>
    </div>
  </div>

  <footer class="text-center p-4 text-xs text-gray-600 dark:text-gray-400 mt-6">
    This product uses the TMDb API but is not endorsed or certified by TMDb.
  </footer>

  <script src="script.js"></script>
</body>
</html>
