<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Movie Diary</title>

  <!-- Tailwind CSS -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />

  <!-- Handwritten Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Shadows+Into+Light&family=DM+Serif+Display&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-paper-light dark:bg-paper-dark text-gray-800 dark:text-gray-100 transition-colors duration-300">

  <header class="p-6 flex justify-between items-center border-b dark:border-gray-700">
    <h1 class="text-3xl font-script">My Movie Diary</h1>
    <div class="flex gap-4 items-center">
      <button id="homeBtn" class="underline hover:opacity-80">Home</button>
      <input type="text" id="searchInput" placeholder="Search for a movie..." class="p-2 border rounded w-60 dark:bg-gray-800 dark:text-white" />
      <button id="toggleMode" class="border px-3 py-1 rounded">Light/Dark</button>
    </div>
  </header>

  <main class="p-6 space-y-10">
    <section id="searchResults" class="hidden">
      <h2 class="text-xl font-script mb-2">Search Results</h2>
      <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6" id="searchGrid"></div>
    </section>

    <nav class="text-center text-lg space-x-4">
      <button class="nav-tab active" data-tab="watchlist">Watchlist</button>
      <button class="nav-tab" data-tab="watching">Watching</button>
      <button class="nav-tab" data-tab="finished">Finished</button>
    </nav>

    <section id="sections">
      <div id="watchlist" class="section-content">
        <h2 class="section-title">Watchlist</h2>
        <div class="movie-grid"></div>
      </div>
      <div id="watching" class="section-content hidden">
        <h2 class="section-title">Watching</h2>
        <div class="movie-grid"></div>
      </div>
      <div id="finished" class="section-content hidden">
        <h2 class="section-title">Finished</h2>
        <div class="movie-grid"></div>
      </div>
    </section>
  </main>

  <div id="modal" class="fixed inset-0 hidden bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white dark:bg-gray-900 p-6 rounded max-w-lg w-full shadow-lg relative">
      <button onclick="closeModal()" class="absolute top-3 right-4 text-gray-500">✕</button>
      <div id="modalContent" class="text-sm space-y-2 mt-4"></div>
    </div>
  </div>

  <footer class="text-center p-4 text-xs text-gray-500 mt-12">
    This product uses the TMDb API but is not endorsed or certified by TMDb.
  </footer>

  <script src="script.js"></script>
</body>
</html>
